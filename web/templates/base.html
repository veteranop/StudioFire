<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ station }}{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="256x256" href="/static/sf_icon_dark.png?v={{ asset_v }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{ asset_v }}">
  <link rel="shortcut icon" href="/static/sf_icon_dark.ico?v={{ asset_v }}">
  <link rel="apple-touch-icon" href="/static/sf_icon_dark.png?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
  {% if ga_id %}
  <!-- GA4 feature-usage counting — OPT-IN ONLY (setup wizard's Done step, or
       Settings -> About &amp; updates). Off means this block is not rendered at
       all. What is sent: which screens were opened, tagged with a random
       install ID. Never the station name, a path, a user name or song data.
       Nothing on the playout path has network code. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('set', 'user_properties', {install_id: {{ ga_install_id|tojson }}});
    gtag('config', '{{ ga_id }}');
  </script>
  {% endif %}
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" title="{{ station }}">
      <img src="/static/sf_icon_dark.png" alt="" class="brand-mark">
      <span class="brand-word">Studio<span class="brand-fire">Fire</span></span>
    </a>
    {% block nav %}{% endblock %}
    <div class="clock"><span class="clock-date" id="topdate"></span>
      <span id="topclock">--:--:--</span></div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Station clock format, chosen on the Settings page. true = 12-hour (AM/PM).
    window.SF_HOUR12 = {{ 'true' if hour12 else 'false' }};
    (function () {
      const el = document.getElementById("topclock");
      const dateEl = document.getElementById("topdate");
      function tick() {
        const d = new Date();
        el.textContent = d.toLocaleTimeString([], {hour12: window.SF_HOUR12});
        // e.g. "Thu, Sep 25" — the date next to the time
        dateEl.textContent = d.toLocaleDateString([],
          {weekday: "short", month: "short", day: "numeric"});
      }
      tick(); setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
